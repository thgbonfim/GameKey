<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameKey - Emulador</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #080b14;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #aviso-iniciar {
      display: none;
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      width: calc(100% - 20px);
      max-width: 420px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(12, 18, 35, 0.95);
      border: 1px solid #eab308;
      color: white;
      font: 14px/1.5 Arial, sans-serif;
      text-align: center;
      pointer-events: none;
    }

    #aviso-iniciar strong {
      color: #facc15;
    }

    @media (max-width: 768px) {
      #aviso-iniciar {
        display: block;
      }
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="aviso-iniciar">
    <strong>GAMEKEY:</strong>
    Se a tela ficar preta, toque em
    <strong>RESET</strong> no menu do emulador.
  </div>

  <script>
    const parametros = new URLSearchParams(window.location.search);

    const core = parametros.get('core');
    const arquivo = parametros.get('game');
    const nome = parametros.get('name') || 'GameKey';

    // Modo de compatibilidade opcional para testar no celular.
    const modoLegado = parametros.get('legacy') === '1';

    if (!core || !arquivo) {
      document.body.innerHTML =
        'Configuração do jogo não encontrada.';
      throw new Error('Emulador ou arquivo não informado.');
    }

    EJS_player = '#game';
    EJS_core = core;
    EJS_gameUrl = arquivo;
    EJS_pathtodata =
      'https://cdn.emulatorjs.org/stable/data/';
    EJS_gameName = nome;
    EJS_language = 'pt-BR';

    // Mantém a inicialização automática.
    EJS_startOnLoaded = true;

    // Ativa WebGL 1 somente no teste com legacy=1.
    EJS_forceLegacyCores = modoLegado;

    EJS_ready = function () {
      console.log('GameKey: EmulatorJS pronto.');
      console.log('Modo de compatibilidade:', modoLegado);
    };
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
