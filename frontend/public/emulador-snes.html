<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameKey - Emulador</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #080b14;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #aviso-iniciar {
      display: none;
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      width: calc(100% - 20px);
      max-width: 420px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(12, 18, 35, 0.95);
      border: 1px solid #eab308;
      color: white;
      font: 14px/1.5 Arial, sans-serif;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #aviso-iniciar strong {
      color: #facc15;
    }

    @media (max-width: 768px) {
      #aviso-iniciar {
        display: block;
      }
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="aviso-iniciar">
  <strong>GAMEKEY:</strong><br>
  Toque em <strong>INICIAR JOGO</strong> para começar.<br>
  Jogo lento ou áudio picotando?<br>
  Experimente utilizar o <strong>Firefox</strong>.
</div>

  <script>
    const parametros = new URLSearchParams(window.location.search);

    const core = parametros.get('core');
    const arquivo = parametros.get('game');
    const nome = parametros.get('name') || 'GameKey';

    const modoLegado = parametros.get('legacy') === '1';
    const testarThreads = parametros.get('threads') === '1';

    const isolamentoAtivo = window.crossOriginIsolated === true;
    const memoriaCompartilhada =
      typeof SharedArrayBuffer !== 'undefined';

    const threadsAtivas =
      testarThreads && isolamentoAtivo && memoriaCompartilhada;

    if (!core || !arquivo) {
      document.body.innerHTML =
        'Configuração do jogo não encontrada.';
      throw new Error('Emulador ou arquivo não informado.');
    }

    EJS_player = '#game';
    EJS_core = core;
    EJS_gameUrl = arquivo;
    EJS_pathtodata =
      'https://cdn.emulatorjs.org/stable/data/';
    EJS_gameName = nome;
    EJS_language = 'pt-BR';

    const userAgent = navigator.userAgent || '';

const androidChromium =
  /Android/i.test(userAgent) &&
  !/Firefox|Fennec/i.test(userAgent);

EJS_startOnLoaded = !androidChromium;
EJS_startButtonName = 'INICIAR JOGO';

    // Multithread somente no teste autorizado.
    EJS_threads = threadsAtivas;

    // WebGL 1 somente quando solicitado.
    EJS_forceLegacyCores = modoLegado;

    EJS_ready = function () {
      console.log('GameKey: EmulatorJS pronto.');
      console.log('Isolamento:', isolamentoAtivo);
      console.log('SharedArrayBuffer:', memoriaCompartilhada);
      console.log('Threads ativadas:', threadsAtivas);
    };


    // Aviso desaparece depois de 5 segundos.
    window.setTimeout(function () {
      const aviso = document.getElementById('aviso-iniciar');

      if (aviso) {
        aviso.style.opacity = '0';

        window.setTimeout(function () {
          aviso.style.display = 'none';
        }, 300);
      }
    }, 5000);
  </script>

  <script>
    // Teste: remover transparencia desnecessaria do canvas WebGL.
    (function () {
      const proto = HTMLCanvasElement.prototype;
      const originalGetContext = proto.getContext;

      proto.getContext = function (type, attributes) {
        if (
          type === 'webgl' ||
          type === 'webgl2' ||
          type === 'experimental-webgl'
        ) {
          attributes = Object.assign({}, attributes || {}, {
            alpha: false,
            premultipliedAlpha: false
          });
        }

        return originalGetContext.call(this, type, attributes);
      };
    })();
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
